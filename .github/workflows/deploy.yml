name: Build & Deploy (Hugo → GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.134.2
  HUGO_ENV: production
  BASEURL: "" # z.B. https://<user>.github.io/<repo>/ wenn nötig

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure config exists (hugo.yaml → config.yaml fallback)
        run: |
          if [ ! -f config.yaml ]; then
            if [ -f hugo.yaml ]; then
              cp hugo.yaml config.yaml
            fi
          fi
          ls -la

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}

      - name: Generate Chroma styles (borland + gruvbox)
        run: |
          mkdir -p static/css
          hugo gen chromastyles --style=borland > static/css/chroma.css
          hugo gen chromastyles --style=gruvbox > static/css/chroma-dark.css

      - name: Build site
        run: |
          if [ -n "${{ env.BASEURL }}" ]; then
            hugo --minify --baseURL "${{ env.BASEURL }}"
          else
            hugo --minify
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Pfad ist relativ zum Repo-Root, nicht zum working-directory
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
