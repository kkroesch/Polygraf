name: Build & Deploy (Hugo → GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.134.2
  HUGO_ENV: production
  # Falls Dein Repo kein User/Org-Root ist, setze BASEURL z.B. auf:
  # https://<owner>.github.io/<repo>/
  BASEURL: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          # extended: true  # nur falls SCSS/PostCSS nötig

      - name: Generate Chroma styles (borland + gruvbox)
        run: |
          mkdir -p doc/static/css
          hugo gen chromastyles --style=borland > doc/static/css/chroma.css
          hugo gen chromastyles --style=gruvbox > doc/static/css/chroma-dark.css

      - name: Build site
        run: |
          if [ -n "${{ env.BASEURL }}" ]; then \
            hugo -s doc --minify --baseURL "${{ env.BASEURL }}"; \
          else \
            hugo -s doc --minify; \
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
