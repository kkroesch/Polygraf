name: Build & Deploy (Hugo → GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.134.2
  HUGO_ENV: production
  BASEURL: ""  # z.B. https://<user>.github.io/<repo>/ falls nötig

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}

      - name: Generate Chroma styles (borland + gruvbox)
        run: |
          mkdir -p static/css
          hugo gen chromastyles --style=borland > static/css/chroma.css
          hugo gen chromastyles --style=gruvbox > static/css/chroma-dark.css

      - name: Build site
        run: |
          if [ -n "${{ env.BASEURL }}" ]; then
            hugo --minify --baseURL "${{ env.BASEURL }}" --themesDir ""
          else
            hugo --minify --themesDir ""
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public   # <- Root, nicht doc/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
